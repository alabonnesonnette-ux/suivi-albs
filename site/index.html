<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.authbox h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:4px 0 0}
.authlogo{width:72px;height:72px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;box-shadow:0 4px 14px rgb(0 0 0/.15)}
.authform{display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:8px}
.authform input[type=email],.authform input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font:inherit;color:inherit}
.authmsg{min-height:18px;color:var(--crit);font-size:13px}

<style>
/* Layout: one mobile-first column — header with view switch, tabs, dossiers by urgency, full-screen sheets for detail and forms */
:root{
  --bg:#F3EDE0; --surface:#FFFFFF; --sunk:#E9E0CC; --ink:#2A2614; --muted:#6E664A; --line:#DDD3BC;
  --brand:#7F6F1F; --brand-ink:#FFFFFF; --gold:#A89331; --gold-ink:#231F0C; --pros:#3F3A1B; --pros-ink:#F3EDE0;
  --crit:#B83A2E; --crit-bg:#FBE4E0; --warn:#B4651C; --warn-bg:#FCEBD6; --ok:#3F7A4D; --ok-bg:#E2F0E3;
  --f-display:"Afrah","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Glacial Indifference","Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mnt:#2D6A9F; --mnt-bg:#E1ECF6; --men:#7B4FA6; --men-bg:#EFE6F7;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150D; --surface:#221F13; --sunk:#2C2818; --ink:#F3EDE0; --muted:#B9AE8A; --line:#3A3420;
  --brand:#CDB75A; --brand-ink:#17150D; --gold:#A89331; --gold-ink:#17150D; --pros:#F3EDE0; --pros-ink:#2A2614;
  --crit:#F08070; --crit-bg:#3E1E1A; --warn:#EDA65E; --warn-bg:#3A2816; --ok:#7DBB8B; --ok-bg:#1E3123; --mnt:#86B9E6; --mnt-bg:#1B2A38; --men:#C7A6E6; --men-bg:#2C2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150D; --surface:#221F13; --sunk:#2C2818; --ink:#F3EDE0; --muted:#B9AE8A; --line:#3A3420;
  --brand:#CDB75A; --brand-ink:#17150D; --gold:#A89331; --gold-ink:#17150D; --pros:#F3EDE0; --pros-ink:#2A2614;
  --crit:#F08070; --crit-bg:#3E1E1A; --warn:#EDA65E; --warn-bg:#3A2816; --ok:#7DBB8B; --ok-bg:#1E3123; --mnt:#86B9E6; --mnt-bg:#1B2A38; --men:#C7A6E6; --men-bg:#2C2238; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:.2px}
h1 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.tabs{display:flex;background:var(--gold);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 9px;border-radius:8px;font-weight:600;font-size:13px;color:var(--gold-ink);white-space:nowrap}
.tabs button[data-view="pros"]{background:var(--pros);color:var(--pros-ink);margin-left:4px}
.tabs button[data-view="pros"][aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--pros)}
.mic{margin-top:6px;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink)}
.mic.on{background:var(--crit);border-color:var(--crit);color:#fff}
.ent-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px}
.ent-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.ent-sec h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.ent-sec p{margin:0;white-space:pre-wrap}
.ent-code{background:var(--gold);color:#fff;border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ent-code b{font-size:24px;letter-spacing:.06em}
.rq{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--men);border-radius:10px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.rq p{margin:0;white-space:pre-wrap}
.rq small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.fac-l{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.fac-h{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--sunk);font-weight:700}
.fac-r{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.fac-r .t{min-width:0;flex:1}
.fac-r .t span{display:block;font-size:12px;color:var(--muted)}
.fac-r .m{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fac-r.done .t,.fac-r.done .m{opacity:.55}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.fbtn.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:6px 16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sum b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sum span{font-size:12px;color:var(--muted)}
.sum.c b{color:var(--crit)} .sum.w b{color:var(--warn)} .sum.o b{color:var(--mnt)}
button.sum{text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
button.sum[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.summary.s4{grid-template-columns:repeat(4,1fr);gap:6px}
.summary.s4 .sum{padding:9px 10px}
.summary.s4 .sum span{display:block;line-height:1.25}

.att-menage{--ac:#7B4FA6;--ac-bg:#EFE6F7}
.att-plateforme{--ac:#B03A6F;--ac-bg:#FBE3EE}
.att-franck{--ac:#1F7A75;--ac-bg:#DDF1EF}
.att-ph{--ac:#2D6A9F;--ac-bg:#E1ECF6}
.att-julien{--ac:#B4651C;--ac-bg:#FCEBD6}
.att-manon{--ac:#3F7A4D;--ac-bg:#E2F0E3}
.att-marion{--ac:#7F6F1F;--ac-bg:#F2ECCF}
.att-proprietaire{--ac:#9A4A2A;--ac-bg:#F6E3D9}
.att-autre{--ac:#4F5B66;--ac-bg:#E6EAEE}
.att-libre{--ac:#6E664A;--ac-bg:#E9E0CC}
.att-aucun{--ac:#6E664A;--ac-bg:#E9E0CC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .att-menage{--ac:#C7A6E6;--ac-bg:#2C2238} :root:not([data-theme="light"]) .att-plateforme{--ac:#F08CB8;--ac-bg:#3A1C2A} :root:not([data-theme="light"]) .att-franck{--ac:#6FD0C8;--ac-bg:#16302E} :root:not([data-theme="light"]) .att-ph{--ac:#86B9E6;--ac-bg:#1B2A38} :root:not([data-theme="light"]) .att-julien{--ac:#EDA65E;--ac-bg:#3A2816} :root:not([data-theme="light"]) .att-manon{--ac:#7DBB8B;--ac-bg:#1E3123} :root:not([data-theme="light"]) .att-marion{--ac:#D9C46A;--ac-bg:#2E2A14} :root:not([data-theme="light"]) .att-proprietaire{--ac:#E3A285;--ac-bg:#3A2318} :root:not([data-theme="light"]) .att-autre{--ac:#B3BEC8;--ac-bg:#262C31} :root:not([data-theme="light"]) .att-libre{--ac:#B9AF92;--ac-bg:#2B2719} :root:not([data-theme="light"]) .att-aucun{--ac:#B9AF92;--ac-bg:#2B2719}}
:root[data-theme="dark"] .att-menage{--ac:#C7A6E6;--ac-bg:#2C2238} :root[data-theme="dark"] .att-plateforme{--ac:#F08CB8;--ac-bg:#3A1C2A} :root[data-theme="dark"] .att-franck{--ac:#6FD0C8;--ac-bg:#16302E} :root[data-theme="dark"] .att-ph{--ac:#86B9E6;--ac-bg:#1B2A38} :root[data-theme="dark"] .att-julien{--ac:#EDA65E;--ac-bg:#3A2816} :root[data-theme="dark"] .att-manon{--ac:#7DBB8B;--ac-bg:#1E3123} :root[data-theme="dark"] .att-marion{--ac:#D9C46A;--ac-bg:#2E2A14} :root[data-theme="dark"] .att-proprietaire{--ac:#E3A285;--ac-bg:#3A2318} :root[data-theme="dark"] .att-autre{--ac:#B3BEC8;--ac-bg:#262C31} :root[data-theme="dark"] .att-libre{--ac:#B9AF92;--ac-bg:#2B2719} :root[data-theme="dark"] .att-aucun{--ac:#B9AF92;--ac-bg:#2B2719}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac);margin-right:6px;vertical-align:1px;flex:none}
.attline{font-size:13px;color:var(--ac,var(--ink));background:var(--ac-bg,var(--sunk));border-radius:8px;padding:4px 8px;align-self:flex-start}
.attline b{color:inherit}
.chip.attc[aria-pressed="true"],.pick button.attc[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--surface)}
.chip.attc[aria-pressed="true"] .adot,.pick button.attc[aria-pressed="true"] .adot{background:var(--surface)}
.techrub{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.techrub:first-of-type{border-top:0;padding-top:4px}
.techsub{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted)}
.impgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.impit{display:flex;flex-direction:column;gap:4px;border:2px solid transparent;background:var(--surface);border-radius:10px;padding:4px;font:inherit;cursor:pointer;min-width:0;text-align:left}
.impit img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}
.impit .pdfbig{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:7px;background:var(--crit-bg);color:var(--crit);font-weight:700}
.impit .impn{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impit.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.stepwrap{border-top:1px solid var(--line)}
.stepwrap:first-child{border-top:0}
.stepwrap .steprow{border-top:0}
.quichip{flex:none;display:inline-flex;align-items:center;border:1px solid var(--ac,var(--line));background:var(--ac-bg,var(--surface));color:var(--ac,var(--muted));border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quichip.vide{border-style:dashed;background:none;color:var(--muted)}
.quichip.fait{opacity:.55}
.quichip[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ink)}
.quipick{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;padding:10px;margin-block:4px 10px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.attbox{border-left:4px solid var(--ac,var(--line))}
.attnow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.attnow b{text-align:right}
.att-libre .adot{background:none;border:1.5px dashed var(--ac)}
.chiplbl{font-size:12px;font-weight:600;color:var(--muted);align-self:center;margin-right:2px}
.attchips{margin-top:2px}
.stale{font-size:12.5px;font-weight:600;color:var(--mnt);background:var(--mnt-bg);border-radius:8px;padding:4px 8px;align-self:flex-start}
.sec-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .ttl{font-weight:600;font-size:15px;min-width:0;flex:1 1 190px}
.card .row1{flex-wrap:wrap}
.card .meta{font-size:13px;color:var(--muted)}
.card .next{font-size:13px}
.card .next em{font-style:normal;color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
.pill.l3{background:var(--crit-bg);color:var(--crit)} .pill.l2{background:var(--warn-bg);color:var(--warn)} .pill.l1{background:var(--ok-bg);color:var(--ok)} .pill.l0{background:var(--sunk);color:var(--muted)}
.steps{display:flex;gap:4px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--brand)}
.filters{display:flex;flex-direction:column;gap:8px;margin-block:4px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],.field input[type=month],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;box-sizing:border-box}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgb(0 0 0/.22);z-index:6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:12px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:2}
.sheethead h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-wrap:balance;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.boxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.steprow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.steprow:first-child{border-top:0}
.steprow .check{flex:1;min-width:0;border-top:0}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.addrow .btn{flex:none}
.stdel{flex:none;border:0;background:var(--crit-bg);color:var(--crit);width:28px;height:28px;border-radius:50%;padding:0;font-size:12px}
.check input{width:20px;height:20px;accent-color:var(--brand);margin:1px 0 0;flex:none}
.check .who{display:block;font-size:12px;color:var(--muted)}
.check.done .t{color:var(--muted);text-decoration:line-through}
.due{font-size:12px;font-weight:600}
.due.late{color:var(--crit)} .due.soon{color:var(--warn)} .due.fine{color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > *{flex:1 1 140px}
.note{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.note:first-of-type{border-top:0;padding-top:0}
.note .who{font-size:12px;color:var(--muted)}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.deadline{border-radius:var(--r);padding:10px 12px;font-size:14px;font-weight:600}
.deadline.l3{background:var(--crit-bg);color:var(--crit)} .deadline.l2{background:var(--warn-bg);color:var(--warn)} .deadline.l1{background:var(--ok-bg);color:var(--ok)}
.lgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .go{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;padding:11px 14px;text-align:left}
.lrow .n{font-weight:600;min-width:0}

    const q=$("#fQ");q.oninput=e=>{fQ=e.target.value;clearTimeout(q.t);q.t=setTimeout(()=>{render();const n=$("#fQ");n.focus();n.setSelectionRange(n.value.length,n.value.length)},300)};

  } else {

    const groups=groupLog(actuels);
    const known=new Set(logements.map(l=>norm(l.nom)));const anciens=[...logements.filter(l=>l.ancien),...new Map(dossiers.filter(d=>d.logement&&!known.has(norm(d.logement))).map(d=>[norm(d.logement),{id:"",nom:d.logement,old:true}])).values()];

function openDetail(id){if(id!==openId){stepEdit=false;sqOpen=null;sqAutre=null}if(logOpen){retLog=logOpen;logOpen=null}menOpen=null;menBack=null;auditOpen=null;openId=id;formState=null;$("#sheet").hidden=false;renderDetail()}

  const r=await fetch(SUPA_URL+"/functions/v1/rappels",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPA_KEY,Authorization:"Bearer "+tok},body:JSON.stringify(body)});if(!r.ok)throw new Error("http "+r.status);return r.json()}
async function patch(d,data,msg){
  try{await db.doc("dossiers/"+d.id).update({...data,updatedAt:nowIso()});if(msg)toast(msg)}catch(e){toast(failMsg(e))}
}

/* ---------- dossier form ---------- */
function openForm(d,preset,prefill){

    :{photos:[],fichiers:[],type:preset==="litige"?"litige":"suivi",origine:preset==="litige"?"Litige":"Remarque femme de ménage",statut:"ouvert",categorie:"",titre:"",logement:fLog||"",dateIncident:today(),dateLimite:"",urgent:false,desc:"",intervenant:"",montant:"",aFacturer:"",quiIntervient:"",voyageur:"",reference:"",plateforme:"",depart:"",dateDeclaration:"",montantDemande:"",...(prefill||{})};
  $("#sheet").hidden=false;renderForm();
}

  <div class="field"><span class="lbl">Catégorie</span><div class="pick">${CATS.map(c=>`<button type="button" data-ca="${esc(c)}" aria-pressed="${f.categorie===c}">${esc(c)}</button>`).join("")}</div>${f.categorie&&!CATS.includes(f.categorie)?`<span class="hint">Catégorie actuelle : ${esc(f.categorie)}</span>`:""}</div>
  ${f.type!=="litige"&&!f.id?`<div class="field"><span class="lbl">Statut</span><div class="seg"><button type="button" data-st="ouvert" aria-pressed="${f.statut!=="info"}">Ouvert · à traiter</button><button type="button" data-st="info" aria-pressed="${f.statut==="info"}">Info · pour mémoire</button></div></div>`:""}
  ${f.litigeId?`<div class="band">Suivi logement créé à partir du litige « ${esc((dossiers.find(x=>x.id===f.litigeId)||{}).titre||"")} ».</div>`:""}
  <div class="field"><label for="fTitre">${LT?"Objet du litige":"Quel est le problème ?"}</label><input type="text" id="fTitre" value="${esc(f.titre)}" placeholder="${LT?"Ex. : Table de cuisine brûlée":"Ex. : Lit cassé dans la chambre"}"></div>
  <div class="field"><label for="fLog">Logement</label><input type="text" id="fLog" list="logList" value="${esc(f.logement)}" placeholder="Tapez le nom, ex. : La Parenthèse" autocomplete="off"><span class="hint">Écrivez librement : les logements connus sont proposés pendant la frappe.</span></div>
  <div class="field"><label for="fDate">${LT?"Date du constat":"Date"}</label><input type="date" id="fDate" value="${esc(f.dateIncident)}"></div>
  <div class="field"><span class="lbl">Photos et documents PDF</span>
    ${f.photos.length?`<div class="thumbs">${f.photos.map((a,i)=>`<span class="th"><img src="${blob(a)}" alt="Photo ${i+1}" loading="lazy"><button class="x" type="button" data-fph="${i}" aria-label="Retirer la photo ${i+1}">✕</button></span>`).join("")}</div>`:""}
    ${f.fichiers.length?`<div class="pdfs">${f.fichiers.map((x,i)=>`<div class="pdfl"><span class="ic">PDF</span><a href="${blob(x.id)}" target="_blank" rel="noopener">${esc(x.name||"Document PDF")}</a><button class="x" type="button" data-fpdf="${i}" aria-label="Retirer ${esc(x.name||"le document")}">✕</button></div>`).join("")}</div>`:""}
    ${assets?`<label class="btn photo-btn">${f.envoi?"Envoi en cours…":"📎 Ajouter des photos ou un PDF"}<input type="file" id="fFiles" accept="image/*,application/pdf" multiple hidden ${f.envoi?"disabled":""}></label><span class="hint">Une ou plusieurs photos, et/ou des documents PDF (devis, facture, constat…).</span>`:`<span class="hint">L'ajout de fichiers n'est pas disponible depuis ce compte.</span>`}
  </div>
  ${LT?`<div class="box"><h3>Voyageur et réservation</h3>
    <div class="grid2"><div class="field"><label for="fVoy">Nom et prénom du voyageur</label><input type="text" id="fVoy" value="${esc(f.voyageur)}" placeholder="Ex. : Marie Dupont"></div>
    <div class="field"><label for="fRef">Référence de réservation</label><input type="text" id="fRef" value="${esc(f.reference)}" placeholder="Ex. : HMABC12345"></div></div>
    <div class="grid2"><div class="field"><label for="fPlat">Plateforme</label><select id="fPlat"><option value="">Choisir…</option>${PLATS.map(p=>`<option ${p===f.plateforme?"selected":""}>${p}</option>`).join("")}</select></div>
    <div class="field"><label for="fDep">Date de sortie du voyageur</label><input type="date" id="fDep" value="${esc(f.depart)}"></div></div>
    <div class="grid2"><div class="field"><label for="fDem">Montant demandé (€)</label><input type="text" inputmode="decimal" id="fDem" value="${esc(f.montantDemande)}" placeholder="Ex. : 229"></div>
    <div class="field"><label for="fDecl">Date de déclaration</label><input type="date" id="fDecl" value="${esc(f.dateDeclaration)}"><span class="hint">Si le litige est déjà déclaré.</span></div></div>
    <div class="field"><label for="fDl">À déclarer avant le</label><input type="date" id="fDl" value="${esc(f.dateLimite)}"><span class="hint">${auto?"Laissez vide pour le calcul automatique : "+fmt(auto)+(f.depart?" (sortie + 14 jours, règle Airbnb).":" (constat + 14 jours). Indiquez la date de sortie pour un calcul exact."):"Calculé automatiquement : date de sortie + 14 jours."}</span></div></div>`:""}

  <div class="field"><label for="fMont">Montant (€)</label><input type="text" id="fMont" inputmode="decimal" value="${esc(f.montant)}" placeholder="Ex. : 80"></div></div>
  <div class="field"><label for="fFac">À facturer</label><select id="fFac"><option value="" ${f.aFacturer===""?"selected":""}>Pas encore décidé</option><option value="oui" ${f.aFacturer==="oui"?"selected":""}>Oui</option><option value="non" ${f.aFacturer==="non"?"selected":""}>Non</option></select></div>
  ${f.id?"":`<div class="field"><label for="fDesc">Détails (facultatif)</label><textarea id="fDesc" placeholder="Ce qui a été constaté, photos prises…">${esc(f.desc)}</textarea></div>`}
  <label class="check" style="border:0"><input type="checkbox" id="fUrg" ${f.urgent?"checked":""}><span>Marquer comme urgent</span></label>
  <button class="btn pri" type="button" id="fSave">${f.id?"Enregistrer":"Créer le dossier"}</button></div>`;
  const read=()=>{const g=(id,k)=>{const el=$(id);if(el)f[k]=el.value};g("#fTitre","titre");g("#fLog","logement");g("#fDate","dateIncident");g("#fDl","dateLimite");g("#fInt","intervenant");g("#fMont","montant");g("#fFac","aFacturer");g("#fDesc","desc");g("#fVoy","voyageur");g("#fRef","reference");g("#fPlat","plateforme");g("#fDep","depart");g("#fDem","montantDemande");g("#fDecl","dateDeclaration");f.urgent=$("#fUrg").checked};
  s.querySelectorAll("[data-or]").forEach(b=>b.onclick=()=>{read();f.origine=b.dataset.or;f.type=f.origine==="Litige"?"litige":"suivi";if(f.type==="litige")f.statut="ouvert";renderForm()});
  s.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>{read();f.categorie=b.dataset.ca;renderForm()});
  s.querySelectorAll("[data-qf]").forEach(b=>b.onclick=()=>{read();const k=f.quiIntervient===b.dataset.qf?"":b.dataset.qf;f.quiIntervient=k;if(k==="nous"){f.urgent=true;f.statut="ouvert"}else if(k==="proprietaire"){f.urgent=false;f.statut="info"}renderForm()});
  s.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{read();f.statut=b.dataset.st;renderForm()});
  s.querySelectorAll("[data-fph]").forEach(b=>b.onclick=()=>{read();f.photos.splice(+b.dataset.fph,1);renderForm()});
  s.querySelectorAll("[data-fpdf]").forEach(b=>b.onclick=()=>{read();f.fichiers.splice(+b.dataset.fpdf,1);renderForm()});
  if($("#fFiles"))$("#fFiles").onchange=async e=>{const files=[...e.target.files];e.target.value="";if(!files.length)return;read();f.envoi=true;renderForm();let bad=0;
    for(const file of files){try{if(file.type==="application/pdf"){const r=await assets.upload(file,{type:"application/pdf"});f.fichiers.push({id:r.id,name:file.name,type:"application/pdf"})}else f.photos.push(await uploadOne(file))}catch(err){bad++}}
    f.envoi=false;if(formState!==f)return;renderForm();toast(bad?(bad+" fichier"+(bad>1?"s n'ont":" n'a")+" pas pu être ajouté"+(bad>1?"s":"")+" (photo ou PDF uniquement)"):"Fichier"+(files.length>1?"s":"")+" ajouté"+(files.length>1?"s":""))};
  $("#fDate").onchange=()=>{read();renderForm()};
  if($("#fDep"))$("#fDep").onchange=()=>{read();renderForm()};
  $("#fSave").onclick=async()=>{read();
    if(f.envoi)return toast("Attendez la fin de l'envoi des fichiers");
    if(!f.origine)return toast("Choisissez d'où vient le souci");
    if(!f.categorie)return toast("Choisissez une catégorie");
    if(!f.titre.trim())return toast("Décrivez le problème en quelques mots");
    if(!f.logement.trim())return toast("Indiquez le logement");
    const known=logements.find(l=>norm(l.nom)===norm(f.logement));
    const body={type:f.type,origine:f.origine,categorie:f.categorie,titre:f.titre.trim(),logement:known?known.nom:f.logement.trim(),dateIncident:f.dateIncident||null,dateLimite:f.type==="litige"?(f.dateLimite||null):null,urgent:f.urgent,photos:f.photos,fichiers:f.fichiers,updatedAt:nowIso()};
    Object.assign(body,{intervenant:f.intervenant.trim()||null,montant:num(f.montant),aFacturer:f.aFacturer===""?null:f.aFacturer==="oui"});
    if(f.type==="litige")Object.assign(body,{voyageur:f.voyageur.trim(),reference:f.reference.trim(),plateforme:f.plateforme,depart:f.depart||null,montantDemande:num(f.montantDemande),dateDeclaration:f.dateDeclaration||null,...(f.dateDeclaration?{etapes:{declare:{done:true,at:nowIso()}}}:{})});
    if(!f.id&&f.litigeId)body.litigeId=f.litigeId;
    if(f.type!=="litige"){body.quiIntervient=f.quiIntervient||null;if(f.quiIntervient==="nous"){body.urgent=true;if(f.id){body.statut="ouvert";body.closLe=null}}else if(f.quiIntervient==="proprietaire"){body.urgent=false;if(f.id){body.statut="info";body.closLe=null}}}
    if(!f.id&&f.dateIncident)body.mois=f.dateIncident.slice(0,7);
    $("#fSave").disabled=true;
    try{
      if(f.id){await db.doc("dossiers/"+f.id).update(body);
        let msg="Dossier mis à jour";
        if(f.type==="litige"){const kids=dossiers.filter(x=>x.litigeId===f.id&&x.type!=="litige");
          for(const k of kids){await db.doc("dossiers/"+k.id).update({aFacturer:body.aFacturer,montant:body.montant!=null?body.montant:(body.montantDemande!=null?body.montantDemande:null),updatedAt:nowIso()})}
          if(kids.length)msg="Litige et suivi logement mis à jour"}
        toast(msg);openDetail(f.id)}
      else{const ref=db.collection("dossiers").doc();const notes={};if(f.desc.trim())notes["n"+Date.now().toString(36)]={texte:f.desc.trim(),at:nowIso()};
        await ref.set({etapes:{},...body,statut:f.type==="litige"?"ouvert":f.statut,taches:{},notes,creeLe:nowIso()});toast("Dossier créé");openDetail(ref.id)}
    }catch(e){$("#fSave").disabled=false;toast(failMsg(e))}
  };
}

/* ---------- logement sheet ---------- */
function openLogSheet(nom){rqForm=false;rqDel=null;entEdit=false;entDraft=null;auditForm=false;auditOpen=null;editKey=null;addRub=false;histOpen=null;lsTab=mode==="menage"?"fiche":"suivi";menOpen=null;logOpen=nom;retLog=null;openId=null;formState=null;$("#sheet").hidden=false;renderLogSheet()}
function renderLogSheet(){
  const nom=logOpen, l=logements.find(x=>norm(x.nom)===norm(nom)), s=$("#sheet"), sy=s.scrollTop;
  const mine=dossiers.filter(d=>norm(d.logement)===norm(nom));
  /* Les dossiers de catégorie « Ménage » sont rangés dans l'onglet Ménages du logement */
  const isMen=d=>d.categorie==="Ménage"||attKey(d)==="menage", menD=l?mine.filter(isMen):[], hors=l?mine.filter(d=>!isMen(d)):mine;
  const op=hors.filter(isOpen).sort(byUrgency), inf=hors.filter(d=>d.statut==="info"), cl=hors.filter(d=>d.statut==="clos");
  const keep={rubVal:$("#rubVal")?.value,rubLab:$("#rubLab")?.value,rubVis:$("#rubVis")?.checked,asTxt:$("#asTxt")?.value||""};
  const team=mode==="equipe", tab=!l?"suivi":(team?lsTab:"fiche");
  const head=`<div class="wrap"><div class="sheethead"><h2>${esc(l?.nom||nom)}</h2><button class="btn ghost" type="button" data-close>Fermer</button></div>
  <div class="hint">${l?esc((l.lieu||"Sans secteur")+(l.ancien?" · ancien logement":"")):"Nom trouvé dans d'anciens dossiers"}${team?" · "+mine.length+" dossier"+(mine.length>1?"s":"")+" au total":""}</div>
  ${team&&l?`<div class="seg3">${[["suivi","Suivi"],["fiche","Fiche"],["entree","Entrée"],["menages","Ménages"]].map(([k,t])=>`<button type="button" data-lstab="${k}" aria-pressed="${tab===k}">${t}</button>`).join("")}</div>`:""}`;
  if(tab==="fiche"){s.innerHTML=head+(team?`<div class="inline"><button class="btn" type="button" id="lsPdf">⬇ Fiche complète (PDF)</button></div>`:"")+ficheHtml(l,team)+`</div>`;s.scrollTop=sy;
    if($("#lsPdf"))$("#lsPdf").onclick=()=>downloadFiches([l],"Fiche "+l.nom.replace(/œ/g,"oe").replace(/Œ/g,"Oe").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 '._-]/g,"").trim()+" "+today()+".pdf");
    if($("#rubVal")&&keep.rubVal!=null){$("#rubVal").value=keep.rubVal;if($("#rubLab")&&keep.rubLab!=null)$("#rubLab").value=keep.rubLab;if(keep.rubVis!=null)$("#rubVis").checked=keep.rubVis}
    if($("#asTxt"))$("#asTxt").value=keep.asTxt;bindFiche(l,team);return}
  if(tab==="entree"){renderEntree(l,head,s,sy);return}
  if(tab==="menages"){const ms=menages.filter(x=>norm(x.logement)===norm(l.nom));const g=new Map();for(const x of [...ms].sort((a,b)=>b.date.localeCompare(a.date))){const k=x.date.slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(x)}
    const RQ=Object.entries(l.remarquesMenage||{}).map(([id,r])=>({id,...r})).filter(r=>!r.supprime).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    const rqBox=`<div class="box"><h3>Remarques ménage</h3>${rqForm?`<div class="field"><label for="rqTxt">Nouvelle remarque</label><textarea id="rqTxt" rows="4" placeholder="Ex. : bien détartrer la douche, le linge de lit se range dans l'armoire du couloir…"></textarea>${micBtn("rqTxt")}</div>${assets?`<div class="field"><span class="lbl">Photos</span><label class="btn photo-btn" style="align-self:flex-start">📷 Ajouter une ou plusieurs photos<input type="file" id="rqPh" accept="image/*" multiple hidden></label><span class="hint" id="rqPhN"></span></div>`:""}<div class="inline"><button class="btn pri" type="button" id="rqSave">Enregistrer</button><button class="btn ghost" type="button" id="rqCancel">Annuler</button></div>`:`<button class="btn" type="button" id="rqAdd">+ Ajouter une remarque</button>`}
      ${RQ.length?`<div class="list" style="margin-top:10px">${RQ.map(r=>`<div class="rq"><div style="min-width:0;flex:1">${r.texte?`<p>${esc(r.texte)}</p>`:""}${(r.photos||[]).length?thumbs(r.photos.map(a=>({a}))):""}<small>${fmtAt(r.at)}${r.par?" · "+esc(r.par):""}</small></div><button class="btn ghost" type="button" data-rqdel="${esc(r.id)}" aria-label="Supprimer cette remarque" style="padding:2px 8px">${rqDel===r.id?"Confirmer":"✕"}</button></div>`).join("")}</div>`:(rqForm?"":`<div class="hint" style="margin-top:8px">Aucune remarque pour l'instant.</div>`)}</div><div class="sec-title"><span>Ménages réalisés</span></div>`;
    const mOp=menD.filter(isOpen).sort(byUrgency),mInf=menD.filter(d=>d.statut==="info"),mCl=menD.filter(d=>d.statut==="clos");
    const relBox=`<div class="sec-title"><span>Problèmes ménage déclarés</span><span>${mOp.length} en cours</span></div>
      ${mOp.length?`<div class="list">${mOp.map(card).join("")}</div>`:`<div class="empty">Aucun problème ménage en cours. Ici se rangent tous les dossiers de catégorie « Ménage » (audits, femmes de ménage, voyageurs…) et ceux qui attendent l'équipe ménage.</div>`}
      ${mInf.length?`<div class="sec-title"><span>Infos ménage</span><span>${mInf.length}</span></div><div class="list">${mInf.map(card).join("")}</div>`:""}
      ${mCl.length?`<details class="pers"><summary>Remarques ménage closes · ${mCl.length}</summary>${byMonth(mCl)}</details>`:""}
      <div class="inline" style="margin-top:10px"><button class="btn" type="button" id="lsNewMen">+ Signaler une remarque ménage</button></div>`;
    s.innerHTML=head+rqBox.replace('<div class="sec-title"><span>Ménages réalisés</span></div>','')+relBox+'<div class="sec-title" style="margin-top:24px"><span>Ménages réalisés</span></div>'+(ms.length?[...g.entries()].map(([k,a])=>`<div class="sec-title"><span>${MOIS[+k.slice(5)-1]} ${k.slice(0,4)}</span><span>${a.filter(x=>x.statut==="valide").length} validé${a.length>1?"s":""}</span></div><div class="list">${a.map(menCard).join("")}</div>`).join(""):`<div class="empty">Aucun ménage enregistré pour ce logement.</div>`)+`</div>`;s.scrollTop=sy;
    if($("#rqAdd"))$("#rqAdd").onclick=()=>{rqForm=true;renderLogSheet();$("#rqTxt")?.focus()};
    $("#lsNewMen").onclick=()=>{fLog=l.nom;const r=logOpen;openForm(null,"suivi",{categorie:"Ménage"});fLog=null;retLog=r};
    if($("#rqCancel"))$("#rqCancel").onclick=()=>{rqForm=false;renderLogSheet()};
    if($("#rqPh"))$("#rqPh").onchange=e=>{const n=e.target.files.length;$("#rqPhN").textContent=n?n+" photo"+(n>1?"s":"")+" sélectionnée"+(n>1?"s":""):""};
    if($("#rqSave"))$("#rqSave").onclick=async()=>{const t=$("#rqTxt").value.trim(),files=[...($("#rqPh")?.files||[])];if(!t&&!files.length)return toast("Écrivez la remarque ou ajoutez une photo");const b=$("#rqSave");b.disabled=true;if(files.length)b.textContent="Envoi des photos…";
      try{const ids=[];for(const f of files)ids.push(await uploadOne(f));
        await db.doc("logements/"+l.id).update({remarquesMenage:{["r"+Date.now().toString(36)]:{texte:t,photos:ids,at:nowIso(),par:who()}}});rqForm=false;toast("Remarque ajoutée");renderLogSheet()}catch(e){b.disabled=false;b.textContent="Enregistrer";toast(failMsg(e))}};
    s.querySelectorAll("[data-rqdel]").forEach(b=>b.onclick=async()=>{const id=b.dataset.rqdel;if(rqDel!==id){rqDel=id;renderLogSheet();return}rqDel=null;
      try{await db.doc("logements/"+l.id).update({remarquesMenage:{[id]:{supprime:true}}});toast("Remarque supprimée")}catch(e){toast(failMsg(e))}});
    return}
  s.innerHTML=head+`
  ${l?(()=>{const ok=auditDone(l),a=lastAudit(l),hist=auditsOf(l);return `<div class="audit ${ok?"ok":"todo"}"><b>${ok?"✓ Audit fait le "+fmt(a.date):"⚠ Audit à faire"}</b>
    ${ok&&a.note?`<span class="hint" style="white-space:pre-wrap">${esc(a.note)}</span>`:""}${!ok&&a?`<span class="hint">Dernier audit le ${fmt(a.date)}, avant la tournée en cours.</span>`:""}${!ok&&!a?`<span class="hint">Ce logement n'a encore jamais été contrôlé.</span>`:""}

let prosMineOpen=false, prospects=[], prosOpen=null, prosCur=null, prosTab="lancement", prosStep=0, prosDirty=false, prosSaving=false, prosT=null, prosAsk=null, prosUp={};
const pV=p=>p.v||{};
const pName=p=>pV(p).log_nom||[pV(p).log_type,pV(p).log_adr].filter(Boolean).join(" · ")||"Nouveau prospect";
const pSub=p=>[pV(p).prop_nom||pV(p).soc_nom,pV(p).log_ville].filter(Boolean).join(" · ")||"Propriétaire à renseigner";
const pStat=k=>(P_STATUTS.find(s=>s[0]===k)||P_STATUTS[0])[1];
const pTask=(p,id)=>{const s=(p.suivi||{})[id];const d=P_TASKS.find(x=>x[0]===id);return{who:d?d[2]:"",...(s||{})}};
function pProg(p){const c=(p.suivi||{})._custom||[];const tot=P_TASKS.length+c.length;const ok=P_TASKS.filter(t=>pTask(p,t[0]).done).length+c.filter(x=>x.done).length;return{ok,tot,pct:tot?Math.round(ok/tot*100):0}}
const pNext=p=>{for(const t of P_TASKS)if(!pTask(p,t[0]).done)return t[1];return ""};
const pMine=()=>{const n=norm(me.prenom);if(!n)return[];const out=[];for(const p of prospects){if(p.statut==="lance"&&pProg(p).pct===100)continue;
  for(const [sec,ts] of P_CHECK)for(const [id,l] of ts){const st=pTask(p,id);if(!st.done&&norm(st.who)===n)out.push({p,id,l})}
  for(const c of ((p.suivi||{})._custom||[]))if(!c.done&&norm(c.who)===n)out.push({p,id:c.id,l:c.l})}return out};

function prosView(m){
  const mine=pMine();
  const enc=prospects.filter(p=>p.statut!=="lance").sort((a,b)=>String(b.majLe||"").localeCompare(String(a.majLe||"")));
  const lan=prospects.filter(p=>p.statut==="lance").sort((a,b)=>pName(a).localeCompare(pName(b),"fr"));
  const card=p=>{const g=pProg(p),nx=pNext(p),st=p.statut||"prospect";return `<button class="card" type="button" data-pros="${esc(p.id)}"><div class="row1"><div class="ttl">${esc(pName(p))}</div><span class="pill ${st==="lance"?"l1":st==="prospect"?"l0":"info"}">${esc(pStat(st))}</span></div>
    <div class="meta">${esc(pSub(p))}${p.logementId?` · <span style="color:var(--ok);font-weight:600">✓ dans Logements</span>`:""}</div>
    <div class="steps" aria-hidden="true">${P_CHECK.map(([,ts])=>`<i class="${ts.every(t=>pTask(p,t[0]).done)?"on":""}"></i>`).join("")}</div>
    <div class="next">${g.pct===100?"<em>Lancement terminé</em>":`<em>Lancement ${g.pct} % · prochaine étape :</em> ${esc(nx)}`}</div></button>`};
  m.innerHTML=`${me.prenom&&mine.length?`<details class="pers" style="margin-top:6px"${prosMineOpen?" open":""} id="pMineD"><summary>Mes tâches de lancement · ${mine.length}</summary><div class="box" style="margin-top:8px">${mine.map(x=>`<label class="check"><input type="checkbox" data-pmine="${esc(x.p.id)}|${esc(x.id)}"><span class="t">${esc(x.l)}<span class="who">${esc(pName(x.p))}</span></span></label>`).join("")}</div></details>`:""}
    <div class="sec-title"><span>En cours</span><span>${enc.length}</span></div>
    ${enc.length?`<div class="list">${enc.map(card).join("")}</div>`:`<div class="empty">Aucun prospect en cours. Au prochain rendez-vous client, appuyez sur « Nouveau prospect » : la fiche et la check-list de lancement s'ouvrent.</div>`}
    ${lan.length?`<details class="pers" style="margin-top:20px"><summary>En ligne · ${lan.length}</summary><div class="list">${lan.map(card).join("")}</div></details>`:""}`;
  if($("#pMineD"))$("#pMineD").ontoggle=e=>{prosMineOpen=e.target.open};
  m.querySelectorAll("[data-pmine]").forEach(c=>c.onchange=async()=>{const [pid,tid]=c.dataset.pmine.split("|");const p=prospects.find(x=>x.id===pid);if(!p)return;
    const s=JSON.parse(JSON.stringify(p.suivi||{}));if(tid.startsWith("x")){const t=(s._custom||[]).find(x=>x.id===tid);if(t){t.done=true;t.at=nowIso();t.par=who()}}else s[tid]={...pTask(p,tid),done:true,at:nowIso(),par:who()};
    try{await db.doc("prospects/"+pid).update({suivi:s,majLe:nowIso()});toast("Tâche faite")}catch(e){toast(failMsg(e))}});
}
async function newProspect(){
  const ref=db.collection("prospects").doc();const d={v:{rdv_date:today()},statut:"prospect",suivi:{},creeLe:nowIso(),majLe:nowIso()};
  try{await ref.set(d);openProspect(ref.id,"fiche")}catch(e){toast(failMsg(e))}
}
function openProspect(id,tab){const p=prospects.find(x=>x.id===id)||{id,...(SB.store.get("prospects")?.get(id)||{})};
  prosOpen=id;prosCur=JSON.parse(JSON.stringify(p));prosCur.v=prosCur.v||{};prosCur.suivi=prosCur.suivi||{};prosTab=tab||"lancement";prosStep=0;prosAsk=null;prosDirty=false;
  openId=null;formState=null;logOpen=null;retLog=null;menOpen=null;auditOpen=null;$("#sheet").hidden=false;$("#sheet").scrollTop=0;renderProspect()}
function prosTouch(){prosDirty=true;prosCur.majLe=nowIso();clearTimeout(prosT);prosT=setTimeout(prosFlush,700)}
async function prosFlush(){clearTimeout(prosT);if(!prosCur||!prosDirty)return;if(prosSaving){prosT=setTimeout(prosFlush,400);return}
  prosSaving=true;prosDirty=false;const id=prosCur.id,{id:_,...data}=prosCur;
  try{await db.doc("prospects/"+id).set(JSON.parse(JSON.stringify(data)))}catch(e){prosDirty=true;toast(failMsg(e))}prosSaving=false}

function pField(f){const v=prosCur.v,val=v[f.k],id="pf_"+f.k,w=f.w?"":` style="grid-column:1/-1"`;
  switch(f.t){
   case "text":case "tel":case "email":case "num":case "date":return `<div class="field"${w}><label for="${id}">${esc(f.l)}${f.max?` <span data-pcount="${f.k}">${(val||"").length}/${f.max}</span>`:""}</label><input type="${f.t==="num"?"number":f.t==="text"?"text":f.t}" ${f.t==="num"?'inputmode="decimal" min="0"':""} id="${id}" data-pk="${f.k}" value="${esc(val)}" placeholder="${esc(f.ph||"")}"></div>`;
   case "area":return `<div class="field"${w}><label for="${id}">${esc(f.l)}</label><textarea id="${id}" data-pk="${f.k}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea></div>`;
   case "chips":case "multi":{const sel=f.t==="multi"?(val||[]):[val];return `<div class="field"${w}><label>${esc(f.l)}</label><div class="chips">${f.o.map(o=>`<button type="button" class="chip" data-pchip="${f.k}" data-pmulti="${f.t==="multi"?1:""}" data-pval="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}</div></div>`}
   case "beds":{const b=v.beds||{};return `<div class="field" style="grid-column:1/-1"><label>${esc(f.l)}</label><div style="display:grid;gap:6px">${P_ROOMS.map(([k,l])=>{const r=b[k]||{};return `<div style="display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:6px;align-items:center"><span style="font-size:13px">${l}</span><select data-pbed="${k}" data-ppart="t" aria-label="${l} : type de lit">${P_BEDS.map(t=>`<option ${r.t===t?"selected":""}>${t}</option>`).join("")}</select><input type="number" min="1" inputmode="numeric" data-pbed="${k}" data-ppart="n" value="${esc(r.n||"")}" placeholder="Nb" aria-label="${l} : nombre"></div>`}).join("")}</div></div>`}
   case "equip":{const eq=v.eq||{};return `<div class="chips" style="grid-column:1/-1">${f.items.map(i=>{const s=eq[i]||0;return `<button type="button" class="chip peq" data-peq="${esc(i)}" data-s="${s}">${esc(i)}${s===2?" · à acheter":s===1?" ✓":""}</button>`}).join("")}</div>`}
   case "docs":{const slots=f.slots||P_DOCS,docs=v.docs||{};return `<div style="grid-column:1/-1">${slots.map(([k,l,sub])=>{const d=docs[k]||{},fs=(d.files||[]);return `<div class="check"><input type="checkbox" id="pd_${k}" data-pdoc="${k}" ${d.ok||fs.length?"checked":""}><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><label for="pd_${k}" class="t" style="font-weight:600">${esc(l)}${sub?`<span class="who">${esc(sub)}</span>`:""}</label>
      ${fs.length?`<div class="chips">${fs.map((x,i)=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center;max-width:100%"><a href="${esc(pubUrl(x.id))}" target="_blank" rel="noopener" style="color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">${/^image/.test(x.type)?"📷":"📄"} ${esc(x.name)}</a><button type="button" class="btn ghost" data-prmf="${k}|${i}" aria-label="Retirer ${esc(x.name)}" style="padding:0 4px">✕</button></span>`).join("")}</div>`:""}
      ${prosUp[k]?`<span class="hint">Envoi en cours…</span>`:`<label class="btn photo-btn" style="font-size:13px;padding:5px 12px">+ Fichier<input type="file" hidden multiple accept="image/*,application/pdf" data-pupl="${k}"></label>`}</div></div>`}).join("")}</div>`}}
  return ""}
function pFicheHtml(){const S=P_STEPS[prosStep],v=prosCur.v;
  return `<div class="chips" role="group" aria-label="Étapes de la fiche">${P_STEPS.map((x,i)=>`<button type="button" class="chip" data-pstep="${i}" aria-pressed="${i===prosStep}">${i+1}. ${x.n}</button>`).join("")}</div>

function entParse(txt){const L=String(txt||"").split(/\r?\n/).map(x=>x.trim());const out={adresse:"",steps:[],wifi:[],videos:[],code:""};let mode="";

    if(/^vid[ée]o( d'entr[ée]e| entr[ée]e)?\s*:?\s*$/i.test(x)){mode="video";continue}
    const url=(x.match(/https?:\/\/\S+/)||[])[0];
    if(url&&(mode==="video"||/youtu/i.test(url))){const lab=x.replace(url,"").replace(/[:\-–—]\s*$/,"").trim();out.videos.push({url,lab});continue}
    if(/^vid[ée]o/i.test(x)){mode="video";continue}

    if(!out.adresse&&!out.steps.length){out.adresse=x;continue}

function authScreen(kind,msg){
  const a=$("#auth");a.hidden=false;
  if(kind==="login")a.innerHTML=`<div class="authbox"><div class="authlogo img"><img src="logo-albs.png" alt="À La Bonne Sonnette, conciergerie"></div><h2>Suivi ALBS</h2><p class="hint">À La Bonne Sonnette · espace équipe</p>
    <form id="loginForm" class="authform"><div class="field"><label for="lgMail">E-mail</label><input type="email" id="lgMail" autocomplete="username" required></div>
    <div class="field"><label for="lgPass">Mot de passe</label><input type="password" id="lgPass" autocomplete="current-password" required></div>
    <button class="btn pri" type="submit" id="lgBtn">Se connecter</button><div class="authmsg" id="lgMsg">${msg?esc(msg):""}</div>
    <p class="hint">Mot de passe oublié ? Demandez à Manon de le réinitialiser.</p></form></div>`;
  else if(kind==="wait")a.innerHTML=`<div class="authbox"><div class="authlogo img"><img src="logo-albs.png" alt="À La Bonne Sonnette, conciergerie"></div><h2>Compte en attente</h2><p>${esc(msg)}</p><button class="btn" type="button" id="lgOut">Se déconnecter</button></div>`;
  else if(kind==="error")a.innerHTML=`<div class="authbox"><div class="authlogo img"><img src="logo-albs.png" alt="À La Bonne Sonnette, conciergerie"></div><h2>Connexion impossible</h2><p>${esc(msg)}</p><button class="btn pri" type="button" onclick="location.reload()">Réessayer</button></div>`;
  if($("#loginForm"))$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#lgBtn").disabled=true;$("#lgMsg").textContent="Connexion…";
    const {error}=await sb.auth.signInWithPassword({email:$("#lgMail").value.trim(),password:$("#lgPass").value});
    if(error){$("#lgBtn").disabled=false;$("#lgMsg").textContent=/invalid/i.test(error.message)?"E-mail ou mot de passe incorrect.":"Connexion impossible : "+error.message}};
  if($("#lgOut"))$("#lgOut").onclick=()=>sb.auth.signOut();
}
async function loadMe(user){
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error)throw error;
  me={id:user.id,email:user.email,prenom:(data&&data.prenom)||"",role:(data&&data.role)||"aucun"};
  if(me.role==="equipe"){try{mode=localStorage.getItem("albs-mode")||"equipe";moi=localStorage.getItem("albs-fdm")||""}catch(e){mode="equipe"}if(mode==="menage"&&!moi)mode="equipe"}
  else if(me.role==="menage"){mode="menage";moi=me.prenom}
}
async function startApp(user){
  try{await loadMe(user)}catch(e){return authScreen("error","Le profil n'a pas pu être chargé. Vérifiez votre connexion internet.")}
  if(me.role==="aucun")return authScreen("wait","Votre compte ("+me.email+") est bien créé. Manon doit maintenant vous donner un accès « équipe » ou « ménage ».");
  if(me.role==="menage"&&!me.prenom)return authScreen("wait","Votre accès ménage n'a pas encore de prénom associé. Demandez à Manon de le compléter.");
  $("#auth").hidden=true;$("#auth").innerHTML="";
  if(booted){render();return}booted=true;
  db=sbDb;assets=sbAssets;downloads=sbDownloads;view=TABS[mode][0][0];sbRealtime();
  const busy=()=>auditForm||editKey||addRub;
  db.collection("logements").onSnapshot(s=>{logements=s.docs.map(d=>({id:d.id,...d.data()}));render();if(auditOpen){}else if(logOpen&&!busy())renderLogSheet();else if(menOpen&&!degForm)renderMenage()},()=>{});
  db.doc("config/menage").onSnapshot(s=>{const d=s.exists?s.data():{};cfgM={protocole:d.protocole||[],equipe:d.equipe||[]};render()},()=>{});
  db.collection("menages").onSnapshot(s=>{menages=s.docs.map(d=>({id:d.id,...d.data()}));render();if(menOpen&&!degForm)renderMenage();else if(logOpen&&lsTab==="menages")renderLogSheet();else if(openId)renderDetail()},()=>{});
  db.doc("config/audit").onSnapshot(s=>{auditCfg=s.exists?s.data():{};render();if(logOpen&&!busy())renderLogSheet()},()=>{});
  if(me.role==="equipe"){
    db.doc("config/sauvegarde").onSnapshot(s=>{sauvegarde=s.exists?s.data():{};render()},()=>{});
    db.collection("prospects").onSnapshot(s=>{prospects=s.docs.map(d=>({id:d.id,...d.data()}));render();
      if(prosCur&&$("#sheet").querySelector("[data-ptab]")){const r=prospects.find(x=>x.id===prosCur.id);const ae=document.activeElement;
        if(r&&!prosDirty&&!prosSaving&&String(r.majLe||"")>String(prosCur.majLe||"")&&!(ae&&ae.closest&&ae.closest("#sheet")&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))){prosCur=JSON.parse(JSON.stringify(r));prosCur.v=prosCur.v||{};prosCur.suivi=prosCur.suivi||{};renderProspect()}}},()=>{});
    db.collection("factures").onSnapshot(s=>{factures=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    db.collection("audits").onSnapshot(s=>{audits=s.docs.map(d=>({id:d.id,...d.data()}));render();if(auditOpen)renderAudit();else if(logOpen&&!busy())renderLogSheet()},()=>{});
    db.collection("dossiers").onSnapshot(s=>{dossiers=s.docs.map(d=>({id:d.id,...d.data()}));render();
      if(!openFromUrl.done){openFromUrl.done=true;const q=new URLSearchParams(location.search).get("d");if(q&&dossiers.some(x=>x.id===q)&&mode==="equipe"){openId=q;$("#sheet").hidden=false;history.replaceState(null,"",location.pathname)}}if(openId)renderDetail();else if(auditOpen)renderAudit();else if(logOpen&&!busy())renderLogSheet();else if(menOpen&&!degForm)renderMenage()},()=>{});
  }
  render();
}
/* ---------- mon compte ---------- */
async function openAccount(){(function w(n){if($("#pushZone")&&$("#pushZone").textContent.startsWith("Vérification"))bindPush();else if(n<80)setTimeout(()=>w(n+1),100)})(0);
  const s=$("#sheet");s.hidden=false;openId=null;formState=null;logOpen=null;retLog=null;menOpen=null;auditOpen=null;
  const E=me.role==="equipe";
  if(E){const {data}=await sb.from("profiles").select("*").order("created_at");profils=data||[]}
  s.innerHTML=`<div class="wrap"><div class="sheethead"><h2>Mon compte</h2><button class="btn ghost" type="button" data-close>Fermer</button></div>
  <div class="box"><h3>Connectée</h3><dl class="kv"><dt>E-mail</dt><dd>${esc(me.email)}</dd><dt>Accès</dt><dd>${me.role==="equipe"?"Équipe (tout l'outil)":"Ménage"+(me.prenom?" · "+esc(me.prenom):"")}</dd></dl>
    <div id="pwZone" class="inline"><button class="btn" type="button" id="pwOpen">Changer mon mot de passe</button><button class="btn" type="button" id="logout">Se déconnecter</button></div></div>
  ${E?`<div class="box"><h3>Accès de l'équipe</h3><div class="hint">Créez d'abord le compte dans Supabase (Authentication → Users → Add user). Il apparaît ici : donnez-lui un prénom et un accès. Pour l'équipe ménage, le prénom doit être celui de la liste « Équipe ménage » pour le récap mensuel.</div>
    <datalist id="fdmList">${(cfgM.equipe||[]).map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
    ${profils.map(p=>`<div class="rub"><b style="overflow-wrap:anywhere">${esc(p.email||"")}</b><div class="grid2"><div class="field"><label for="pp-${esc(p.id)}">Prénom</label><input type="text" id="pp-${esc(p.id)}" list="fdmList" value="${esc(p.prenom||"")}"></div>
      <div class="field"><label for="pr-${esc(p.id)}">Accès</label><select id="pr-${esc(p.id)}" ${p.id===me.id?"disabled":""}>${[["aucun","Aucun (bloqué)"],["equipe","Équipe"],["menage","Ménage"]].map(([k,l])=>`<option value="${k}" ${p.role===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
      <div><button class="btn pri" type="button" data-psave="${esc(p.id)}">Enregistrer</button></div></div>`).join("")||`<div class="hint">Aucun compte.</div>`}</div>
  <div class="box"><h3>Voir l'appli comme…</h3><div class="hint">Pour vérifier ce que voit une femme de ménage.</div><div class="who-pick"><button type="button" data-mode="equipe" aria-pressed="${mode==="equipe"}"><b>Équipe</b><span>Vue complète</span></button>
    ${(cfgM.equipe||[]).map(n=>`<button type="button" data-mode="menage" data-fdm="${esc(n)}" aria-pressed="${mode==="menage"&&moi===n}"><b>${esc(n)}</b><span>Vue ménage</span></button>`).join("")}</div></div>
  ${E?pushBox():""}
  <div class="box"><h3>Sauvegarde de secours</h3><div class="hint">Télécharge une copie complète de toutes les données (logements, dossiers, litiges, audits, ménages, réglages). Gardez ce fichier dans un endroit sûr : en cas d'erreur, il permet de tout remettre avec « Importer des données ». Conseillé une fois par mois.</div>
    <div class="hint" id="bkLast">${sauvegarde.lastAt?"Dernière sauvegarde : le "+fmtAt(sauvegarde.lastAt):"Aucune sauvegarde pour l'instant."}</div>
    <div><button class="btn pri" type="button" id="bkBtn">Exporter toutes les données</button></div></div>
  <div class="box"><h3>Importer des données</h3><div class="hint">Pour le transfert depuis l'ancienne version : choisissez le fichier suivi-albs-donnees.json. Les éléments avec le même identifiant sont remplacés.</div><label class="btn photo-btn">Choisir le fichier<input type="file" accept=".json,application/json" hidden id="impIn"></label><div id="impMsg" class="hint"></div></div>`:""}
  </div>`;
  $("#logout").onclick=async()=>{try{localStorage.removeItem("albs-mode");localStorage.removeItem("albs-fdm")}catch(e){}await sb.auth.signOut();location.reload()};
  $("#pwOpen").onclick=()=>{$("#pwZone").innerHTML=`<div class="field" style="flex:1 1 220px"><label for="pwNew">Nouveau mot de passe (8 caractères minimum)</label><input type="password" id="pwNew" autocomplete="new-password"></div><button class="btn pri" type="button" id="pwSave" style="flex:0 0 auto;align-self:flex-end">Enregistrer</button>`;
    $("#pwSave").onclick=async()=>{const v=$("#pwNew").value;if(v.length<8)return toast("8 caractères minimum");const {error}=await sb.auth.updateUser({password:v});toast(error?"Échec : "+error.message:"Mot de passe changé")}};
  s.querySelectorAll("[data-psave]").forEach(b=>b.onclick=async()=>{const id=b.dataset.psave,pr=$("#pp-"+CSS.escape(id)).value.trim(),ro=$("#pr-"+CSS.escape(id)).value;
    const {error}=await sb.from("profiles").update(id===me.id?{prenom:pr}:{prenom:pr,role:ro}).eq("id",id);toast(error?"Échec : "+error.message:"Accès enregistré");if(!error&&id===me.id)me.prenom=pr});
  if($("#bkBtn"))$("#bkBtn").onclick=async()=>{const b=$("#bkBtn");b.disabled=true;b.textContent="Préparation…";
    try{const docs={};let n=0,from=0;for(;;){const {data,error}=await sb.from("docs").select("coll,id,data").order("coll").order("id").range(from,from+999);if(error)throw error;for(const r of data){(docs[r.coll]=docs[r.coll]||{})[r.id]=r.data;n++}if(data.length<1000)break;from+=1000}
      const now=new Date().toISOString(),day=now.slice(0,10);
      await sbDownloads.save({filename:"suivi-albs-sauvegarde-"+day+".json",data:new Blob([JSON.stringify({app:"suivi-albs",exportedAt:now,count:n,docs})],{type:"application/json"})});
      await db.doc("config/sauvegarde").set({lastAt:now,count:n});$("#bkLast").textContent="Dernière sauvegarde : le "+fmtAt(now)+" ("+n+" éléments)";toast("Sauvegarde téléchargée")}
    catch(e){console.error(e);toast("La sauvegarde n'a pas pu être créée, réessayez")}
    b.disabled=false;b.textContent="Exporter toutes les données"};
  if($("#impIn"))$("#impIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const msg=$("#impMsg");
    try{const j=JSON.parse(await f.text());
      if(j.type==="fiches"){let nl=0,nr=0,sk=0;const miss=[];
        for(const [key,F] of Object.entries(j.fiches||{})){const L=logements.find(l=>l.id===key)||logements.find(l=>norm(l.nom)===norm(F._nom||""));if(!L){miss.push(F._nom||key);continue}
          const upd={};let entU=null;if(F._entree&&!((L.entree||{}).texte||"").trim()){entU={texte:F._entree,ph:[],maj:nowIso(),par:j.par||"Import"};nr++}
          for(const [k,r] of Object.entries(F)){if(k==="_nom"||k==="_entree")continue;const ex=(L.fiche||{})[k];const exImp=ex&&String(ex.par||"").startsWith("Import");if(ex&&!ex.supprime&&(ex.valeur||"").trim()&&!(j.remplaceImport&&exImp)){sk++;continue}if(ex&&(ex.valeur||"")===r.valeur){continue}upd[k]={label:r.label,valeur:r.valeur,menage:r.menage!==false,modifLe:nowIso(),par:j.par||"Import Drive",...(ex&&ex.valeur&&exImp?{hist:{["h"+Date.now().toString(36)+k]:{valeur:ex.valeur,le:nowIso()}}}:{}),...(FICHE_TPL.some(t=>t[0]===k)?{}:{ordre:r.ordre||Date.now()})};nr++}
          if(Object.keys(upd).length||entU){msg.textContent="Remplissage de « "+L.nom+" »…";await db.doc("logements/"+L.id).update({fiche:upd,...(entU?{entree:entU}:{})});nl++}}
        msg.textContent="✓ "+nr+" informations ajoutées dans "+nl+" fiches."+(sk?" "+sk+" rubriques remplies par l'équipe ont été laissées telles quelles.":"")+(miss.length?" Logements introuvables : "+miss.join(", ")+".":"");toast("Fiches remplies");return}
      const rows=[];for(const [c,docs] of Object.entries(j.docs||{}))for(const [id,data] of Object.entries(docs))rows.push({coll:c,id,data});
      if(!rows.length){msg.textContent="Le fichier ne contient aucune donnée.";return}
      msg.textContent="Import de "+rows.length+" éléments…";
      for(let i=0;i<rows.length;i+=200){const {error}=await sb.from("docs").upsert(rows.slice(i,i+200),{onConflict:"coll,id"});if(error)throw error;msg.textContent="Import… "+Math.min(i+200,rows.length)+"/"+rows.length}
      for(const c of SB.store.keys())await sbLoad(c,true);msg.textContent="✓ "+rows.length+" éléments importés.";toast("Import terminé")}
    catch(err){console.error(err);msg.textContent="Import impossible : "+(err.message||"fichier illisible")}};
}
/* ---------- démarrage ---------- */
render();
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session)startApp(session.user);else authScreen("login");
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="SIGNED_IN"&&sess&&!booted)startApp(sess.user);if(ev==="SIGNED_OUT"){location.reload()}});
})();
</script>
